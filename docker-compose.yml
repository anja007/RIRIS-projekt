# MongoDB 7 kot replica set z enim vozliščem (rs0), ker rezervacija uporablja transakcije.
name: salonko-mvp

services:
  mongo:
    image: mongo:7
    container_name: salonko-mvp-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # Ob prvem zagonu inicializira replica set; nato samo preverja, da baza deluje.
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

volumes:
  mongo-data: